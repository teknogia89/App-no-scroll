name: Apk Anti Doom scroll

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Tulis project
        run: |
          mkdir -p NoReels/app/src/main/java/com/example/noreels
          mkdir -p NoReels/app/src/main/res/xml NoReels/app/src/main/res/values
          cd NoReels

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoReels"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.noreels"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.noreels"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 7
                  versionName = "7.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="No Reels"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ReelsBlockerService"
                      android:exported="true"
                      android:label="No Reels &amp; Shorts"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:isAccessibilityTool="true"
              android:notificationTimeout="300"
              android:description="@string/service_description" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_description">Menutup otomatis halaman Reels Instagram dan Shorts YouTube.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/noreels/ReelsBlockerService.java <<'EOF'
          package com.example.noreels;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.LinkedList;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeMap;
          import java.util.TreeSet;
          import java.util.concurrent.ConcurrentHashMap;

          public class ReelsBlockerService extends AccessibilityService {
              static volatile String dumpIg = "(belum ada data Instagram)";
              static volatile String dumpYt = "(belum ada data YouTube)";
              static volatile String dumpHit = "(belum ada layar dengan id reel/clips/short)";
              static volatile String winStr = "-";
              static volatile boolean connected = false;
              static volatile int totalEvents = 0;
              static volatile int polls = 0;
              static volatile int scans = 0;
              static volatile int blocks = 0;
              static volatile long lastPollMs = 0;
              static volatile String lastError = "-";
              static final Map<String, Integer> seen = new ConcurrentHashMap<>();
              static final LinkedList<String> evLog = new LinkedList<>();

              private final Handler main = new Handler(Looper.getMainLooper());
              private HandlerThread worker;
              private Handler bg;
              private volatile boolean running = false;
              private volatile long burstUntil = 0;
              private volatile long lastTargetSeen = 0;
              private volatile long lastKick = 0;

              private final List<View> overlays = new ArrayList<>();
              private String overlayKey = "";

              private String lastKey = "";
              private long lastBlock = 0;
              private long streakStart = 0;
              private long pauseUntil = 0;
              private int blockStreak = 0;
              private long lastWin = 0;
              private long lastDiag = 0;
              private int count = 0;
              private int skipped = 0;

              private static class Found {
                  Set<String> ids = new TreeSet<>();
                  Set<String> sel = new TreeSet<>();
                  Set<String> selIds = new TreeSet<>();
                  Set<String> descs = new TreeSet<>();
                  Set<String> texts = new TreeSet<>();
                  List<String> tabInfo = new ArrayList<>();
              }

              private final Runnable pollOnce = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) return;
                      try {
                          poll();
                      } catch (Throwable t) {
                          lastError = String.valueOf(t);
                      }
                  }
              };

              private final Runnable pollTask = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) return;
                      try {
                          poll();
                      } catch (Throwable t) {
                          lastError = String.valueOf(t);
                      }
                      if (running && bg != null) bg.postDelayed(this, nextDelay());
                  }
              };

              private long nextDelay() {
                  long now = System.currentTimeMillis();
                  if (now < burstUntil) return 150;
                  if (now - lastTargetSeen < 5000) return 350;
                  return 800;
              }

              static String report() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("v7 connected=").append(connected)
                    .append(" events=").append(totalEvents)
                    .append(" polls=").append(polls)
                    .append(" scans=").append(scans)
                    .append(" blocks=").append(blocks)
                    .append(" lastPollMs=").append(lastPollMs)
                    .append("\nERR: ").append(lastError)
                    .append("\nWINS: ").append(winStr)
                    .append("\nPKGS: ");
                  int n = 0;
                  for (Map.Entry<String, Integer> e : new TreeMap<>(seen).entrySet()) {
                      if (n++ >= 40) break;
                      sb.append(e.getKey()).append("=").append(e.getValue()).append(", ");
                  }
                  sb.append("\nEVLOG: ");
                  synchronized (evLog) {
                      for (String s : evLog) sb.append(s).append(" | ");
                  }
                  sb.append("\n\nHIT: ").append(dumpHit);
                  sb.append("\n\n").append(dumpIg).append("\n\n").append(dumpYt);
                  return sb.toString();
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  connected = true;
                  running = true;
                  worker = new HandlerThread("noreels-poll");
                  worker.start();
                  bg = new Handler(worker.getLooper());
                  bg.post(pollTask);
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  running = false;
                  connected = false;
                  if (bg != null) bg.removeCallbacksAndMessages(null);
                  if (worker != null) worker.quitSafely();
                  clearOverlays();
                  return super.onUnbind(intent);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;
                      totalEvents++;
                      CharSequence ep = event.getPackageName();
                      String epk = ep == null ? "" : ep.toString();
                      if (epk.length() > 0 && seen.size() < 200) {
                          Integer c = seen.get(epk);
                          seen.put(epk, c == null ? 1 : c + 1);
                      }
                      if (!isTarget(epk)) return;
                      long now = System.currentTimeMillis();
                      int type = event.getEventType();
                      lastTargetSeen = now;
                      if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                          burstUntil = now + 3000;
                          synchronized (evLog) {
                              evLog.add("t" + type + " " + event.getClassName());
                              while (evLog.size() > 6) evLog.removeFirst();
                          }
                      }
                      if (bg != null && now - lastKick > 250) {
                          lastKick = now;
                          bg.post(pollOnce);
                      }
                  } catch (Throwable t) {
                      lastError = String.valueOf(t);
                  }
              }

              private boolean isTarget(String p) {
                  if (p == null) return false;
                  return p.contains("instagram") || (p.contains("youtube") && !p.contains("music"));
              }

              private void poll() {
                  polls++;
                  final long now = System.currentTimeMillis();
                  List<AccessibilityWindowInfo> ws = getWindows();
                  boolean doWin = now - lastWin > 2000;
                  StringBuilder wsb = new StringBuilder();
                  AccessibilityNodeInfo target = null;
                  String tpkg = "";
                  boolean targetActive = false;
                  boolean otherActive = false;

                  if (ws != null) {
                      for (AccessibilityWindowInfo w : ws) {
                          boolean app = w.getType() == AccessibilityWindowInfo.TYPE_APPLICATION;
                          if (!app && !doWin) continue;
                          AccessibilityNodeInfo r = w.getRoot();
                          String p = "null";
                          if (r != null) {
                              CharSequence cp = r.getPackageName();
                              p = cp == null ? "?" : cp.toString();
                          }
                          if (doWin) {
                              wsb.append("[t").append(w.getType())
                                 .append(w.isActive() ? " A" : "")
                                 .append(w.isFocused() ? " F" : "")
                                 .append(" ").append(p).append("] ");
                          }
                          boolean match = r != null && app && isTarget(p);
                          if (app && w.isActive() && !match) otherActive = true;
                          if (match) {
                              if (w.isActive()) targetActive = true;
                              if (target == null) {
                                  target = r;
                                  tpkg = p;
                                  continue;
                              }
                          }
                          if (r != null) r.recycle();
                      }
                  }
                  if (doWin) {
                      lastWin = now;
                      winStr = wsb.toString();
                  }

                  if (target == null || (otherActive && !targetActive)) {
                      if (target != null) target.recycle();
                      if (lastKey.length() > 0) {
                          lastKey = "";
                          main.post(new Runnable() {
                              @Override
                              public void run() {
                                  clearOverlays();
                              }
                          });
                      }
                      return;
                  }
                  lastTargetSeen = now;

                  final boolean yt = tpkg.contains("youtube");
                  final boolean ig = !yt;
                  String pfx = tpkg + ":id/";
                  boolean reels = false;
                  List<Rect> rects = new ArrayList<>();

                  if (ig) {
                      List<AccessibilityNodeInfo> tab = target.findAccessibilityNodeInfosByViewId(pfx + "clips_tab");
                      if (tab != null) {
                          for (AccessibilityNodeInfo n : tab) {
                              if (n.isSelected()) reels = true;
                              addTabRect(n, rects);
                              n.recycle();
                          }
                      }
                      if (!reels) reels = anyVisible(target, pfx,
                          new String[] {"clips_viewer_view_pager", "clips_viewer_video_layout"});
                  } else {
                      if (!reels) reels = anyVisible(target, pfx,
                          new String[] {"reel_player_page_container", "reel_recycler"});
                  }
                  List<AccessibilityNodeInfo> labels = target.findAccessibilityNodeInfosByText(ig ? "Reels" : "Shorts");
                  if (labels != null) {
                      for (AccessibilityNodeInfo n : labels) {
                          CharSequence d = n.getContentDescription();
                          CharSequence t = n.getText();
                          String ds = d == null ? null : d.toString().trim();
                          String ts = t == null ? null : t.toString().trim();
                          if (isLabel(ds) || isLabel(ts)) {
                              if (selectedUp(n)) reels = true;
                              addTabRect(n, rects);
                          }
                          n.recycle();
                      }
                  }

                  if (now - lastDiag > 8000 && now >= burstUntil) {
                      lastDiag = now;
                      Found f = new Found();
                      count = 0;
                      skipped = 0;
                      scan(target, 0, f);
                      scans++;
                      if (count >= 15) {
                          StringBuilder sb = new StringBuilder();
                          sb.append(tpkg).append(" nodes=").append(count).append(" hidden=").append(skipped)
                            .append("\nSELECTED: ").append(f.sel)
                            .append("\nSELIDS: ").append(f.selIds)
                            .append("\nTABS: ").append(f.tabInfo)
                            .append("\nDESCS: ").append(f.descs)
                            .append("\nTEXTS: ").append(f.texts)
                            .append("\nIDS: ");
                          boolean hit = !f.tabInfo.isEmpty();
                          for (String s : f.ids) {
                              sb.append(s).append(", ");
                              String l = s.toLowerCase();
                              if (l.contains("reel") || l.contains("clips") || l.contains("short")) hit = true;
                          }
                          String dump = sb.toString();
                          if (dump.length() > 6000) dump = dump.substring(0, 6000);
                          if (ig) dumpIg = dump; else dumpYt = dump;
                          if (hit) dumpHit = dump;
                      }
                      if (isReelsFull(ig, f)) reels = true;
                  }
                  target.recycle();

                  StringBuilder key = new StringBuilder();
                  for (Rect r : rects) key.append(r.toShortString()).append(";");
                  String ks = key.toString();
                  if (!ks.equals(lastKey)) {
                      lastKey = ks;
                      final List<Rect> copy = new ArrayList<>(rects);
                      main.post(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  updateOverlays(copy, yt);
                              } catch (Throwable t) {
                                  lastError = String.valueOf(t);
                              }
                          }
                      });
                  }

                  if (reels && now >= pauseUntil && now - lastBlock >= 600) {
                      lastBlock = now;
                      if (now - streakStart > 6000) {
                          streakStart = now;
                          blockStreak = 0;
                      }
                      blockStreak++;
                      if (blockStreak > 4) {
                          pauseUntil = now + 10000;
                          blockStreak = 0;
                      } else {
                          blocks++;
                          performGlobalAction(GLOBAL_ACTION_BACK);
                          main.post(new Runnable() {
                              @Override
                              public void run() {
                                  Toast.makeText(ReelsBlockerService.this, "Reels/Shorts diblokir",
                                      Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                  }
                  lastPollMs = System.currentTimeMillis() - now;
              }

              private boolean anyVisible(AccessibilityNodeInfo root, String pfx, String[] ids) {
                  for (String id : ids) {
                      List<AccessibilityNodeInfo> nodes = root.findAccessibilityNodeInfosByViewId(pfx + id);
                      if (nodes == null) continue;
                      boolean found = false;
                      for (AccessibilityNodeInfo n : nodes) {
                          if (n.isVisibleToUser()) found = true;
                          n.recycle();
                      }
                      if (found) return true;
                  }
                  return false;
              }

              private boolean selectedUp(AccessibilityNodeInfo n) {
                  AccessibilityNodeInfo cur = n;
                  for (int i = 0; i < 2 && cur != null; i++) {
                      if (cur.isSelected()) return true;
                      cur = cur.getParent();
                  }
                  return false;
              }

              private void addTabRect(AccessibilityNodeInfo n, List<Rect> out) {
                  if (!n.isVisibleToUser()) return;
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  Rect r = clickableBounds(n);
                  if (r.isEmpty()) return;
                  if (r.top < dm.heightPixels * 0.8 || r.height() > dm.heightPixels * 0.2) return;
                  for (Rect o : out) {
                      if (o.equals(r)) return;
                  }
                  out.add(r);
              }

              private boolean isLabel(String s) {
                  return s != null && (s.equalsIgnoreCase("reels") || s.equalsIgnoreCase("shorts"));
              }

              private Rect clickableBounds(AccessibilityNodeInfo node) {
                  Rect r = new Rect();
                  AccessibilityNodeInfo n = node;
                  for (int i = 0; i < 5 && n != null; i++) {
                      if (n.isClickable()) {
                          n.getBoundsInScreen(r);
                          return r;
                      }
                      n = n.getParent();
                  }
                  node.getBoundsInScreen(r);
                  return r;
              }

              private void scan(AccessibilityNodeInfo node, int depth, Found f) {
                  if (node == null || depth > 45 || count > 2500) return;
                  if (depth > 0 && !node.isVisibleToUser()) {
                      skipped++;
                      return;
                  }
                  count++;
                  String id = node.getViewIdResourceName();
                  String sid = null;
                  if (id != null) {
                      int i = id.indexOf(":id/");
                      sid = i >= 0 ? id.substring(i + 4) : id;
                      f.ids.add(sid);
                  }
                  CharSequence d = node.getContentDescription();
                  CharSequence t = node.getText();
                  String ds = d == null ? null : d.toString().trim();
                  String ts = t == null ? null : t.toString().trim();
                  if (ds != null && ds.length() > 0 && ds.length() <= 30 && f.descs.size() < 80) f.descs.add(ds);
                  if (ts != null && ts.length() > 0 && ts.length() <= 25 && f.texts.size() < 60) f.texts.add(ts);
                  if (node.isSelected()) {
                      if (ds != null && ds.length() > 0) f.sel.add(ds);
                      if (sid != null) f.selIds.add(sid);
                  }
                  if (isLabel(ds) || isLabel(ts)) {
                      Rect r = new Rect();
                      node.getBoundsInScreen(r);
                      f.tabInfo.add((ds != null ? ds : ts) + " sel=" + node.isSelected()
                          + " " + r.toShortString());
                  }
                  for (int c = 0; c < node.getChildCount(); c++) {
                      AccessibilityNodeInfo child = node.getChild(c);
                      if (child != null) {
                          scan(child, depth + 1, f);
                          child.recycle();
                      }
                  }
              }

              private boolean isReelsFull(boolean ig, Found f) {
                  for (String s : f.sel) {
                      String t = s.trim().toLowerCase();
                      if (ig && t.equals("reels")) return true;
                      if (!ig && t.equals("shorts")) return true;
                  }
                  if (ig && f.selIds.contains("clips_tab")) return true;
                  for (String id : f.ids) {
                      String t = id.toLowerCase();
                      if (ig && t.startsWith("clips_viewer")) return true;
                      if (!ig && (t.startsWith("reel_player") || t.startsWith("reel_recycler")
                              || t.startsWith("reel_watch") || t.startsWith("shorts_player")
                              || t.startsWith("shorts_container"))) return true;
                  }
                  return false;
              }

              private void updateOverlays(List<Rect> rects, boolean yt) {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  List<Rect> keep = new ArrayList<>();
                  StringBuilder key = new StringBuilder();
                  for (Rect r : rects) {
                      if (r.isEmpty() || r.height() > dm.heightPixels * 0.2) continue;
                      String k = r.toShortString();
                      if (key.indexOf(k) >= 0) continue;
                      key.append(k).append(";");
                      keep.add(r);
                  }
                  String ks = key.toString();
                  if (ks.equals(overlayKey)) return;
                  clearOverlays();
                  overlayKey = ks;
                  boolean night = (getResources().getConfiguration().uiMode
                          & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  int color = night ? (yt ? 0xFF0F0F0F : 0xFF000000) : 0xFFFFFFFF;
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  for (Rect r : keep) {
                      View v = new View(this);
                      v.setBackgroundColor(color);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              r.width(), r.height(),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.OPAQUE);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      lp.x = r.left;
                      lp.y = r.top;
                      wm.addView(v, lp);
                      overlays.add(v);
                  }
              }

              private void clearOverlays() {
                  if (overlays.isEmpty()) {
                      overlayKey = "";
                      return;
                  }
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  for (View v : overlays) {
                      try {
                          wm.removeView(v);
                      } catch (Throwable t) {
                          lastError = String.valueOf(t);
                      }
                  }
                  overlays.clear();
                  overlayKey = "";
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/example/noreels/MainActivity.java <<'EOF'
          package com.example.noreels;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 48, 32, 48);
                  Button btn = new Button(this);
                  btn.setText("Buka Pengaturan Aksesibilitas");
                  btn.setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  layout.addView(btn);
                  Button copy = new Button(this);
                  copy.setText("Salin data layar terakhir");
                  copy.setOnClickListener(v -> {
                      ClipboardManager cm =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("dump", ReelsBlockerService.report()));
                      Toast.makeText(this, "Tersalin", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(copy);
                  status = new TextView(this);
                  status.setTextSize(12);
                  status.setTextIsSelectable(true);
                  layout.addView(status);
                  scroll.addView(layout);
                  setContentView(scroll);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText(ReelsBlockerService.report());
              }
          }
          EOF
      - name: Build APK
        run: cd NoReels && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NoReels-apk
          path: NoReels/app/build/outputs/apk/debug/app-debug.apk
