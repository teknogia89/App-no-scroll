name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Tulis project
        run: |
          mkdir -p NoReels/app/src/main/java/com/example/noreels
          mkdir -p NoReels/app/src/main/res/xml NoReels/app/src/main/res/values
          cd NoReels

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoReels"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.noreels"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.noreels"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="No Reels"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ReelsBlockerService"
                      android:exported="true"
                      android:label="No Reels &amp; Shorts"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="300"
              android:description="@string/service_description" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_description">Menutup otomatis halaman Reels Instagram dan Shorts YouTube.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/noreels/ReelsBlockerService.java <<'EOF'
          package com.example.noreels;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeMap;
          import java.util.TreeSet;
          import java.util.concurrent.ConcurrentHashMap;

          public class ReelsBlockerService extends AccessibilityService {
              static volatile String dumpIg = "(belum ada data Instagram)";
              static volatile String dumpYt = "(belum ada data YouTube)";
              static volatile boolean connected = false;
              static volatile int totalEvents = 0;
              static volatile int nullRoot = 0;
              static volatile String lastError = "-";
              static final Map<String, Integer> seen = new ConcurrentHashMap<>();
              private long lastRun = 0;
              private long lastBlock = 0;
              private int count = 0;

              static String report() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("v3 connected=").append(connected)
                    .append(" events=").append(totalEvents)
                    .append(" nullRoot=").append(nullRoot)
                    .append("\nERR: ").append(lastError)
                    .append("\nPKGS: ");
                  int n = 0;
                  for (Map.Entry<String, Integer> e : new TreeMap<>(seen).entrySet()) {
                      if (n++ >= 40) break;
                      sb.append(e.getKey()).append("=").append(e.getValue()).append(", ");
                  }
                  sb.append("\n\n").append(dumpIg).append("\n\n").append(dumpYt);
                  return sb.toString();
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  connected = true;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      handle(event);
                  } catch (Throwable t) {
                      lastError = String.valueOf(t);
                  }
              }

              private void handle(AccessibilityEvent event) {
                  if (event == null || event.getPackageName() == null) return;
                  String pkg = event.getPackageName().toString();
                  totalEvents++;
                  if (seen.size() < 200) {
                      Integer c = seen.get(pkg);
                      seen.put(pkg, c == null ? 1 : c + 1);
                  }
                  boolean yt = pkg.contains("youtube") && !pkg.contains("music");
                  boolean ig = pkg.contains("instagram");
                  if (!ig && !yt) return;

                  long now = System.currentTimeMillis();
                  if (now - lastRun < 400) return;
                  lastRun = now;

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) root = event.getSource();
                  if (root == null) {
                      nullRoot++;
                      return;
                  }
                  Set<String> ids = new TreeSet<>();
                  Set<String> sel = new TreeSet<>();
                  count = 0;
                  scan(root, 0, ids, sel);
                  root.recycle();

                  StringBuilder sb = new StringBuilder();
                  sb.append(pkg).append(" nodes=").append(count)
                    .append("\nSELECTED: ").append(sel).append("\nIDS: ");
                  for (String s : ids) sb.append(s).append(", ");
                  String dump = sb.toString();
                  if (dump.length() > 7000) dump = dump.substring(0, 7000);
                  if (ig) dumpIg = dump; else dumpYt = dump;

                  if (now - lastBlock < 1000) return;
                  if (isReels(ig, ids, sel)) {
                      lastBlock = now;
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      Toast.makeText(this, "Reels/Shorts diblokir", Toast.LENGTH_SHORT).show();
                  }
              }

              private void scan(AccessibilityNodeInfo node, int depth,
                                Set<String> ids, Set<String> sel) {
                  if (node == null || depth > 45 || count > 2500) return;
                  count++;
                  String id = node.getViewIdResourceName();
                  if (id != null) {
                      int i = id.indexOf(":id/");
                      ids.add(i >= 0 ? id.substring(i + 4) : id);
                  }
                  CharSequence d = node.getContentDescription();
                  if (d != null && node.isSelected()) sel.add(d.toString());
                  for (int c = 0; c < node.getChildCount(); c++) {
                      AccessibilityNodeInfo child = node.getChild(c);
                      if (child != null) {
                          scan(child, depth + 1, ids, sel);
                          child.recycle();
                      }
                  }
              }

              private boolean isReels(boolean ig, Set<String> ids, Set<String> sel) {
                  for (String s : sel) {
                      String t = s.trim().toLowerCase();
                      if (ig && t.equals("reels")) return true;
                      if (!ig && t.equals("shorts")) return true;
                  }
                  for (String id : ids) {
                      String t = id.toLowerCase();
                      if (ig && t.startsWith("clips_viewer")) return true;
                      if (!ig && (t.startsWith("reel_player") || t.startsWith("reel_recycler")
                              || t.startsWith("reel_watch") || t.startsWith("shorts_player")
                              || t.startsWith("shorts_container"))) return true;
                  }
                  return false;
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/example/noreels/MainActivity.java <<'EOF'
          package com.example.noreels;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 48, 32, 48);
                  Button btn = new Button(this);
                  btn.setText("Buka Pengaturan Aksesibilitas");
                  btn.setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  layout.addView(btn);
                  Button copy = new Button(this);
                  copy.setText("Salin data layar terakhir");
                  copy.setOnClickListener(v -> {
                      ClipboardManager cm =
                          (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("dump", ReelsBlockerService.report()));
                      Toast.makeText(this, "Tersalin", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(copy);
                  status = new TextView(this);
                  status.setTextSize(12);
                  status.setTextIsSelectable(true);
                  layout.addView(status);
                  scroll.addView(layout);
                  setContentView(scroll);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText(ReelsBlockerService.report());
              }
          }
          EOF
      - name: Build APK
        run: cd NoReels && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NoReels-apk
          path: NoReels/app/build/outputs/apk/debug/app-debug.apk
